<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Food Composition System</title>
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #382aa3;
        --secondary-color: #6c63ff;
      }
      body {
        background-color: #f5f7ff;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .error-card {
        background: white;
        padding: 3rem;
        border-radius: 15px;
        box-shadow: 0 10px 30px rgba(108, 99, 255, 0.1);
        text-align: center;
        max-width: 500px;
        width: 90%;
      }
      .error-icon {
        font-size: 5rem;
        color: var(--secondary-color);
        margin-bottom: 1.5rem;
      }
      .btn-home {
        background: linear-gradient(135deg, var(--secondary-color) 0%, var(--primary-color) 100%);
        border: none;
        border-radius: 50px;
        padding: 0.8rem 2rem;
        font-weight: 600;
        color: white;
        transition: transform 0.3s ease;
      }
      .btn-home:hover {
        transform: translateY(-2px);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="error-card">
      <div class="error-icon"><i class="fas fa-compass"></i></div>
      <h1 class="font-weight-bold mb-2">404</h1>
      <h4 class="text-muted mb-4">Lost in the Pantry?</h4>
      <p class="text-muted mb-4">The page you are looking for does not exist or has been moved.</p>
      <a href="/" class="btn btn-home"><i class="fas fa-home mr-2"></i> Back to Safety</a>
    </div>
  </body>
</html>
